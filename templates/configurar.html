{% extends "_acceso.html" %}
{% block titulo %}Configuración inicial{% endblock %}
{% block contenido %}
  <form method="post">
    <h1>Creá tu cuenta de administrador</h1>
    <p class="ayuda">Es una sola vez. Tu cuenta va a seguir usando todos los datos que ya cargaste.</p>
    {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
    <label class="clave">Contraseña actual de la app<input type="password" name="clave_servidor" autocomplete="off" required><button type="button" class="ver">Mostrar</button></label>
    <label>Tu nombre<input name="nombre" value="{{ form.get('nombre', '') }}" placeholder="Ej: Marco" autocomplete="name" required></label>
    <label>Usuario<input name="usuario" value="{{ form.get('usuario', '') }}" placeholder="Ej: marco" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="clave">Nueva contraseña (mínimo 8)<input type="password" name="clave" autocomplete="new-password" minlength="8" required><button type="button" class="ver">Mostrar</button></label>
    <label class="clave">Repetila<input type="password" name="clave2" autocomplete="new-password" minlength="8" required><button type="button" class="ver">Mostrar</button></label>
    <button class="btn">Crear cuenta y entrar</button>
  </form>
{% endblock %}
