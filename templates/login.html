<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Marquito</title>
<meta name="theme-color" content="#0F1A12">
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0F1A12;color:#F6F9E8;font:16px/1.5 Inter,system-ui,sans-serif}
form{width:min(340px,100%);display:grid;gap:16px;text-align:center}
.logo{width:180px;height:auto;margin:0 auto 8px;display:block}
p{margin:0;color:#A3B0A5}
input{font:inherit;color:#F6F9E8;width:100%;min-height:52px;padding:12px 16px;border-radius:12px;border:1px solid #2E4034;background:#1A2A1E}
input::placeholder{color:#A3B0A5}
input:focus-visible,button:focus-visible{outline:2px solid #C6F135;outline-offset:2px}
button{min-height:52px;border:none;border-radius:999px;background:#C6F135;color:#0F1A12;font:600 16px Poppins,system-ui,sans-serif;cursor:pointer}
.err{color:#FF6B4A;font-size:14px}
</style></head><body>
<form method="post">
  <img class="logo" src="{{ url_for('static', filename='marquito-vertical-sobre-oscuro.svg') }}" alt="marquito">
  <p>Tus gastos, en gajos.</p>
  <input type="password" name="clave" placeholder="Contraseña" aria-label="Contraseña" autofocus required>
  <button>Entrar</button>
  {% if error %}<div class="err" role="alert">Esa no es la contraseña. Probá de nuevo.</div>{% endif %}
</form></body></html>
