{% extends "_acceso.html" %}
{% block contenido %}
  <p class="lema">Tus gastos, en gajos.</p>
  <form method="post">
    {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
    <label>Usuario<input name="usuario" value="{{ nombre_usuario }}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required {% if not nombre_usuario %}autofocus{% endif %}></label>
    <label class="clave">Contraseña<input type="password" name="clave" autocomplete="current-password" required {% if nombre_usuario %}autofocus{% endif %}><button type="button" class="ver" aria-label="Mostrar contraseña">Mostrar</button></label>
    <label class="recordar"><input type="checkbox" name="recordar" checked> Recordarme en este dispositivo</label>
    <button class="btn">Entrar</button>
  </form>
  <p class="pie">¿No tenés cuenta? Pedísela a quien administra Marquito.</p>
{% endblock %}
